# The game is played from this profile (play.bat). Debug assertions and integer overflow
# checks would sit on every guest instruction and throughout Bevy, so they are off.
# Debug info is off too: with it, target/ grew past 50 GB (a 1.2 GB .pdb per link).
[profile.dev]
opt-level = 1
debug = false
debug-assertions = false
overflow-checks = false

# Bevy and the runtime are small and hot: optimize them even in dev builds.
[profile.dev.package."*"]
opt-level = 3

# The runtime (GX decoder, scheduler, DSP), dispatch and the app are workspace members,
# which the wildcard above does not cover: optimize them fully (does not touch the parts).
[profile.dev.package.gc-runtime]
opt-level = 3

[profile.dev.package.mkdd-recomp]
opt-level = 3

[profile.dev.package.mkdd-bevy]
opt-level = 3

# gc-core is the per-instruction hot path; inline and optimize it fully.
[profile.dev.package.gc-core]
opt-level = 3

# The generated parts are huge. Full optimization with few codegen units (incremental
# compilation would split each part into hundreds of units and block inlining between
# guest functions) is what lets the game run at full speed; MKDD_PART_OPT=1 builds much
# faster but runs slower.
[profile.dev.package.mkdd-part-00]
opt-level = 3
debug = false
codegen-units = 16
incremental = false

